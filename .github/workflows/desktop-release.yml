name: Build and publish desktop v1.0.0

on:
  push:
    branches: [release/zhuyi-v1.0.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhuyi-desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: Windows-x64
          - os: macos-14
            target: macOS-arm64
          - os: macos-15-intel
            target: macOS-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify business behavior
        run: python -m unittest discover -s tests -v
      - name: Verify frontend
        shell: bash
        run: |
          set -e
          for suite in format voice attention chat_ui focus; do
            node "tests/test_${suite}.js"
          done
      - name: Install build tools
        run: python -m pip install PyInstaller==6.22.0 Pillow==12.3.0
      - name: Build and test the actual application
        run: python tools/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release-artifacts/desktop/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified downloads
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: packages
          merge-multiple: true
      - name: Verify all three packages
        working-directory: packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 3
          for target in Windows-x64 macOS-arm64 macOS-x64; do
            sha256sum --check "Zhuyi-v1.0.0-${target}.zip.sha256"
          done
      - name: Create release without replacing an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.0.0-desktop
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This release already exists; refusing to replace its downloads.'
            exit 1
          fi
          gh release create "$tag" packages/* --target "$GITHUB_SHA" --draft --title '主一 v1.0.0 · Windows 与 Mac' --notes-file docs/desktop-release-notes.md
          gh release edit "$tag" --draft=false --latest
